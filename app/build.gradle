plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlinx-serialization'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'

    id 'io.sentry.android.gradle' version '6.0.0'
}

def gitCommitHash = providers.exec {
    commandLine("git", "rev-parse", "--verify", "--short", "HEAD")
}.standardOutput.asText.get().trim()

android {
    compileSdk = 36

    defaultConfig {
        applicationId "ani.dantotsu"
        // Android 8.0 (API 26)
        minSdk = 26
        targetSdk = 36
        versionName "4.8.5"
        def (major, minor, patch) = versionName.split("\\.").collect { it.toInteger() }
        versionCode = major * 1_000_000 + minor * 1_000 + patch
        signingConfig signingConfigs.debug

    }

    flavorDimensions += "store"
    productFlavors {
        google {
            // Google Play specific configuration
            dimension "store"
            isDefault true
            apply plugin: 'com.google.gms.google-services'
            apply plugin: 'com.google.firebase.crashlytics'
        }
    }

    buildTypes {
        alpha {
            applicationIdSuffix ".beta" // keep as beta by popular request
            versionNameSuffix "-alpha01-" + gitCommitHash
            manifestPlaceholders.icon_placeholder = "@mipmap/ic_launcher_alpha"
            manifestPlaceholders.icon_placeholder_round = "@mipmap/ic_launcher_alpha_round"
            debuggable System.getenv("CI") == null
            isDefault true
            debuggable true
            jniDebuggable true
            minifyEnabled false
            shrinkResources false
        }
        debug {
            applicationIdSuffix ".beta"
            versionNameSuffix "-beta01"
            manifestPlaceholders.icon_placeholder = "@mipmap/ic_launcher_beta"
            manifestPlaceholders.icon_placeholder_round = "@mipmap/ic_launcher_beta_round"
            debuggable false
        }
        release {
            manifestPlaceholders.icon_placeholder = "@mipmap/ic_launcher"
            manifestPlaceholders.icon_placeholder_round = "@mipmap/ic_launcher_round"
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-gson.pro', 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs = ["-Xcontext-parameters", "-Xmulti-platform"]
    }
    namespace 'ani.dantotsu'
}

dependencies {

//  Libraries that extensions link against at runtime have to track Mihon's versions: extensions
//  are compiled against Mihon's copy but resolve ours, so any drift surfaces as NoSuchMethodError
//  or NoClassDefFoundError inside a source. The set to keep in sync is keiyoushi's "common"
//  bundle: kotlin-stdlib, coroutines, serialization, injekt, rxjava, jsoup, okhttp, okio, quickjs.
//  serialization 1.10+ ships Kotlin 2.3 metadata, so it needs a compiler no more than one minor
//  behind — hence the Kotlin 2.2.20 baseline in the root build file. Don't drop Kotlin below that
//  without also pinning this back to 1.9.0.
    ext.serialization_version = '1.11.0'
    ext.okhttp_version = '5.4.0'

//  FireBase
    googleImplementation platform('com.google.firebase:firebase-bom:34.16.0')
    googleImplementation 'com.google.firebase:firebase-analytics'
    googleImplementation 'com.google.firebase:firebase-crashlytics'
    googleImplementation 'com.google.firebase:firebase-messaging'
    googleImplementation 'com.google.firebase:firebase-database'
//  Core
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.6'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.work:work-runtime-ktx:2.11.2"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.Blatzar:NiceHttp:0.4.4'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$serialization_version"
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation "com.anggrayudi:storage:1.5.5"
    implementation "androidx.biometric:biometric:1.1.0"

//  Nearby Connections (Continue on another device)
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
    implementation 'com.google.zxing:core:3.5.3'

//  CameraX (handoff QR-code scanner)
    ext.camerax_version = '1.4.1'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"


//  Glide
    ext.glide_version = '4.16.0'
    api "com.github.bumptech.glide:glide:$glide_version"
    implementation "com.github.bumptech.glide:glide:$glide_version"
    ksp "com.github.bumptech.glide:ksp:$glide_version"
    implementation "com.github.bumptech.glide:okhttp3-integration:$glide_version"
    implementation 'jp.wasabeef:glide-transformations:4.3.0'

//  Exoplayer
    ext.exo_version = '1.8.0'
    implementation "androidx.media3:media3-exoplayer:$exo_version"
    implementation "androidx.media3:media3-ui:$exo_version"
    implementation "androidx.media3:media3-exoplayer-hls:$exo_version"
    implementation "androidx.media3:media3-exoplayer-dash:$exo_version"
    implementation "androidx.media3:media3-datasource-okhttp:$exo_version"
    implementation "androidx.media3:media3-session:$exo_version"
//  Media3 Casting
    implementation "androidx.media3:media3-cast:$exo_version"
    implementation "androidx.mediarouter:mediarouter:1.7.0"
// Media3 extension
    implementation "io.github.anilbeesetti:nextlib-media3ext:1.8.0-0.9.0"
// Libass for ASS/SSA subtitle rendering
    implementation "io.github.peerless2012:ass-media:0.4.0-beta01"
    implementation "io.github.peerless2012:ass-kt:0.4.0-beta01"
    implementation "androidx.media3:media3-effect:$exo_version"
// Clip export (trims the played stream back into an mp4 / GIF)
    implementation "androidx.media3:media3-transformer:$exo_version"
//  UI
    implementation 'com.google.android.material:material:1.12.0'
    implementation files('libs/AnimatedBottomBar-7fcb9af.aar')
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.flaviofaria:kenburnsview:1.0.7'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    implementation 'com.alexvasilkov:gesture-views:2.8.3'
    implementation 'com.github.VipulOG:ebook-reader:0.1.6'
    implementation 'androidx.paging:paging-runtime-ktx:3.5.0'
    implementation 'com.github.eltos:simpledialogfragments:v3.7'
    implementation 'com.github.AAChartModel:AAChartCore-Kotlin:7.2.3'

//  Markwon
    ext.markwon_version = '4.6.2'
    implementation "io.noties.markwon:core:$markwon_version"
    implementation "io.noties.markwon:editor:$markwon_version"
    implementation "io.noties.markwon:ext-strikethrough:$markwon_version"
    implementation "io.noties.markwon:ext-tables:$markwon_version"
    implementation "io.noties.markwon:ext-tasklist:$markwon_version"
    implementation "io.noties.markwon:html:$markwon_version"
    implementation "io.noties.markwon:image-glide:$markwon_version"
    implementation "io.noties.markwon:linkify:$markwon_version"

//  Groupie
    ext.groupie_version = '2.10.1'
    implementation "com.github.lisawray.groupie:groupie:$groupie_version"
    implementation "com.github.lisawray.groupie:groupie-viewbinding:$groupie_version"

//  String Matching
    implementation 'me.xdrop:fuzzywuzzy:1.4.0'

//  Coroutines — keep in sync with Mihon (currently 1.11.0). Extensions are compiled against
//  Mihon's version but link against *our* copy at runtime, so a stale one here breaks them:
//  1.11.0 gave runBlocking the JVM name "runBlockingK", and an extension that calls it dies
//  with NoSuchMethodError on any host still shipping <= 1.10.2.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

//  Aniyomi
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'io.reactivex:rxandroid:1.2.1'
    // Nothing references voyager itself, but it is what drags in androidx.compose.runtime, which
    // eu.kanade.core.preference.PreferenceMutableState still compiles against. Delete that helper
    // (and PreferenceExtensions.asState, its only caller) and this can go too — the app declares
    // no @Composable anywhere.
    implementation 'ca.gosyer:voyager-navigator:1.0.0-rc07'
    implementation 'com.squareup.logcat:logcat:0.4'
    implementation 'uy.kohesive.injekt:injekt-core:1.16.1'
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "com.squareup.okhttp3:okhttp-dnsoverhttps:$okhttp_version"
    implementation 'com.squareup.okio:okio:3.18.1'
    implementation "com.squareup.okhttp3:okhttp-brotli:$okhttp_version"
    // Mihon ships zstd, so extensions may request it; without it they hit NoClassDefFoundError.
    implementation "com.squareup.okhttp3:okhttp-zstd:$okhttp_version"
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json-okio:$serialization_version"
    // Extensions may serialize with protobuf; Mihon provides it, so we must too.
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-protobuf:$serialization_version"
    implementation 'com.jakewharton.rxrelay:rxrelay:1.2.0'
    implementation 'com.github.tachiyomiorg:unifile:17bec43'
    // Mihon's native AVIF/HEIF/JXL decoder — platform BitmapFactory can't decode these on
    // devices/emulators with an incomplete HEIF codec (e.g. WSA), so it's used as a fallback.
    implementation 'com.github.mihonapp:image-decoder:e08e9be535'
    implementation 'com.github.gpanther:java-nat-sort:natural-comparator-1.1'
    implementation 'app.cash.quickjs:quickjs-android:0.9.2'

}


sentry {
    org = "sloweneuh"
    projectName = "android"

    // this will upload your source code to Sentry to show it as part of the stack traces
    // disable if you don't want to expose your sources
    includeSourceContext = true
}
